services:
     - type: web
       name: linkedin-sdr-automation
       env: docker
       plan: starter
       healthCheckPath: /healthz
       envVars:
         - key: N8N_PORT
           value: 5678
         - key: N8N_PROTOCOL
           value: https
         - key: WEBHOOK_URL
           sync: false
         - key: N8N_BASIC_AUTH_ACTIVE
           value: true
         - key: N8N_BASIC_AUTH_USER
           sync: false
         - key: N8N_BASIC_AUTH_PASSWORD
           sync: false
         - key: DB_TYPE
           value: postgresdb
         - key: DB_POSTGRESDB_HOST
           sync: false
         - key: DB_POSTGRESDB_PORT
           value: 5432
         - key: DB_POSTGRESDB_DATABASE
           sync: false
         - key: DB_POSTGRESDB_USER
           sync: false
         - key: DB_POSTGRESDB_PASSWORD
           sync: false
